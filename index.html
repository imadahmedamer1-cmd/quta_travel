<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب محمود قوطة - حجز تذاكر السفر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a3d;--gold:#d4a84b;--cream:#faf5e8;--ink:#0f2a3d;--bg:#e9ecef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c}}
:root[data-theme="dark"]{--bg:#10161c}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);font-family:'Tajawal',Tahoma,sans-serif;display:flex;justify-content:center;padding:16px}
.ad{width:100%;max-width:520px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--ink)}
.top{position:relative;background:#fff;min-height:360px;display:flex;align-items:stretch;justify-content:space-between;padding:26px 24px 0}
.who{flex:1;padding-top:10px;z-index:2}
.who small{font:700 16px 'Cairo',Tahoma,sans-serif;color:#8a6a1d}
.who h1{font:900 clamp(40px,11vw,58px)/1.05 'Cairo',Tahoma,sans-serif;color:var(--navy);margin:6px 0 10px}
.who p{font:700 18px 'Cairo',Tahoma,sans-serif;color:var(--navy);border-inline-start:4px solid var(--gold);padding-inline-start:10px;max-width:190px}
.photo{width:54%;align-self:flex-end;display:block;margin-bottom:-1px}
.mid{background:var(--navy);color:#fff;padding:26px 24px 8px;position:relative}
.mid h2{font:900 clamp(30px,8.4vw,42px)/1.3 'Cairo',Tahoma,sans-serif}
.mid h2 b{color:var(--gold);font-weight:900}
.stub{margin:20px 0 6px;background:var(--cream);color:var(--navy);border-radius:14px;display:flex;align-items:center;overflow:hidden}
.route{flex:1;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:900 24px 'Cairo',Tahoma,sans-serif}
.route i{font-style:normal;color:#b8892b;font-size:26px}
.route span small{display:block;font:700 12px 'Tajawal',sans-serif;color:#8a6a1d}
.cut{align-self:stretch;border-inline-start:2px dashed #c9b27a;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;font:800 14px 'Cairo',sans-serif;text-align:center;line-height:1.5}
.feat{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:center;font:700 18px 'Cairo',Tahoma,sans-serif}
.feat em{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:900}
.call{background:var(--gold);color:var(--navy);padding:22px 24px 26px;text-align:center}
.call p{font:800 18px 'Cairo',Tahoma,sans-serif}
.num{display:block;direction:ltr;font:900 clamp(34px,10vw,48px)/1.2 'Cairo',sans-serif;letter-spacing:1px;color:var(--navy);text-decoration:none;margin:2px 0 14px}
.btns{display:flex;gap:10px}
.btns a{flex:1;padding:13px 8px;border-radius:12px;font:800 17px 'Cairo',Tahoma,sans-serif;text-decoration:none;text-align:center}
.btns a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.b1{background:var(--navy);color:#fff}.b2{background:#fff;color:var(--navy)}
.cp{display:block;margin-top:10px;padding:11px;border-radius:12px;border:2px solid var(--navy);color:var(--navy);font:800 16px 'Cairo',Tahoma,sans-serif;text-decoration:none;text-align:center}.foot{background:var(--navy);color:var(--gold);text-align:center;padding:12px;font:700 15px 'Cairo',sans-serif}
.top{position:relative;padding:0;min-height:0;display:block;background:#b9c3d3}
.photo{width:100%;height:380px;object-fit:cover;object-position:50% 12%;display:block;margin:0}
.who{position:absolute;inset:auto 0 0 0;padding:60px 24px 18px;background:linear-gradient(transparent,rgba(15,42,61,.92))}
.who small{color:var(--gold)}.who h1{color:#fff;margin:2px 0 6px;font-size:clamp(36px,10vw,52px)}
.who p{color:#fff;max-width:none;border-inline-start:4px solid var(--gold)}
.ticket{display:block;width:100%;border-radius:14px;margin:20px 0 6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
</style></head><body>
